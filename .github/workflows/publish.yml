name: Publish

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged release PR number
        required: true
        type: number

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    steps:
      - name: Resolve release PR from workflow_dispatch input
        id: pr
        uses: actions/github-script@v7
        env:
          WORKFLOW_DISPATCH_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const pullRequestInput = process.env.WORKFLOW_DISPATCH_PULL_REQUEST_NUMBER;
            if (!pullRequestInput) {
              core.setFailed("workflow_dispatch input pull_request_number is required.");
              return;
            }

            if (!Number.isInteger(Number(pullRequestInput)) || Number(pullRequestInput) <= 0) {
              core.setFailed("workflow_dispatch input pull_request_number must be a positive integer.");
              return;
            }

            const prNumber = Number(pullRequestInput.trim());
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (!pr.merged) {
              core.setFailed(`Pull request #${prNumber} is not merged.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`Pull request #${prNumber} targets ${pr.base.ref}, expected main.`);
              return;
            }

            if (!pr.merge_commit_sha) {
              core.setFailed(`Pull request #${prNumber} has no merge commit SHA.`);
              return;
            }

            const prefix = "Release: ";
            if (!pr.title.startsWith(prefix)) {
              core.setFailed(`Pull request #${prNumber} title must start with "${prefix}".`);
              return;
            }

            const releaseTitle = pr.title.slice(prefix.length).trim();
            const separatorIndex = releaseTitle.lastIndexOf("@");
            if (separatorIndex <= 0) {
              core.setFailed(`Pull request title "${pr.title}" must look like "Release: <package>@<version>".`);
              return;
            }

            const expectedReleaseIdentity = releaseTitle.slice(0, separatorIndex);
            const expectedReleaseVersion = releaseTitle.slice(separatorIndex + 1);
            if (!expectedReleaseIdentity || !expectedReleaseVersion) {
              core.setFailed(`Could not parse package name and version from "${pr.title}".`);
              return;
            }

            if (!pr.body || !pr.body.trim()) {
              core.setFailed(`Pull request #${prNumber} body is empty.`);
              return;
            }

            core.setOutput("merge_sha", pr.merge_commit_sha);
            core.setOutput("release_title", releaseTitle);
            core.setOutput("expected_release_identity", expectedReleaseIdentity);
            core.setOutput("expected_release_version", expectedReleaseVersion);
            core.setOutput("release_body", pr.body);
            core.setOutput("pr_number", String(pr.number));
            core.setOutput("pr_url", pr.html_url);

      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.merge_sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package directory
        id: package
        uses: actions/github-script@v7
        env:
          RELEASE_TITLE: ${{ steps.pr.outputs.release_title }}
          EXPECTED_RELEASE_IDENTITY: ${{ steps.pr.outputs.expected_release_identity }}
          EXPECTED_RELEASE_VERSION: ${{ steps.pr.outputs.expected_release_version }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const releaseTitle = process.env.RELEASE_TITLE || "";
            const expectedIdentity = process.env.EXPECTED_RELEASE_IDENTITY;
            const expectedVersion = process.env.EXPECTED_RELEASE_VERSION;
            const prNumber = Number(process.env.PR_NUMBER);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const packageJsonFiles = [];
            for (const file of files) {
              const match = file.filename?.match(/^packages\/([^/]+)\/package\.json$/);
              if (match) {
                packageJsonFiles.push(match[1]);
              }
            }

            const uniquePackageDirs = [...new Set(packageJsonFiles)];
            if (uniquePackageDirs.length === 0) {
              core.setFailed(`No package.json files changed in PR #${prNumber}.`);
              return;
            }

            if (uniquePackageDirs.length > 1) {
              core.setFailed(`Multiple package.json files changed in PR #${prNumber}: ${uniquePackageDirs.join(", ")}.`);
              return;
            }

            const packageDir = uniquePackageDirs[0];
            const packageJsonPath = path.join(process.cwd(), "packages", packageDir, "package.json");
            if (!fs.existsSync(packageJsonPath)) {
              core.setFailed(`Expected package manifest at ${packageJsonPath} after checking out merge commit.`);
              return;
            }

            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
            const packageName = packageJson.name;
            const packageVersion = packageJson.version;

            const expectedTag = `${expectedIdentity}@${expectedVersion}`;
            const releaseTag = `${packageName}@${packageVersion}`;
            if (expectedTag !== releaseTag) {
              core.setFailed(`PR title requires ${expectedTag}, but merge commit package manifest has ${releaseTag}.`);
              return;
            }

            if (releaseTag !== releaseTitle) {
              core.setFailed(`Release title ${releaseTitle} does not match merge commit identity ${releaseTag}.`);
              return;
            }

            core.setOutput("package_dir", path.join("packages", packageDir));
            core.setOutput("package_name", packageName);
            core.setOutput("version", packageVersion);
            core.setOutput("release_tag_name", releaseTag);

      - name: Check npm publication state
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: bun run --cwd "$PACKAGE_DIR" build

      - name: Publish package to npm
        if: steps.npm.outputs.already_published != 'true'
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: npm publish --access public
        working-directory: ${{ steps.package.outputs.package_dir }}

      - name: Check release tag target commit
        id: tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.package.outputs.release_tag_name }}
          EXPECTED_MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        with:
          script: |
            const tagName = process.env.TAG_NAME;
            const expectedMergeSha = process.env.EXPECTED_MERGE_SHA;
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tagName}`,
            }).catch((error) => {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                return null;
              }
              throw error;
            });

            if (!tagRef) {
              return;
            }

            let tagObject = tagRef.data.object;
            if (tagObject.type === "tag") {
              const tagPayload = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagObject.sha,
              });
              tagObject = tagPayload.data.object;
            }

            if (tagObject.type !== "commit") {
              core.setFailed(`Tag ${tagName} points to non-commit object ${tagObject.type}.`);
              return;
            }

            core.setOutput("exists", "true");
            core.setOutput("resolved_commit_sha", tagObject.sha);
            if (tagObject.sha !== expectedMergeSha) {
              core.setFailed(`Tag ${tagName} points to ${tagObject.sha}, expected merge SHA ${expectedMergeSha}.`);
            }

      - name: Create git tag
        if: steps.tag.outputs.exists != 'true'
        env:
          TAG_NAME: ${{ steps.package.outputs.release_tag_name }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$MERGE_SHA"
          git push origin "refs/tags/$TAG_NAME"

      - name: Check GitHub Release state
        id: release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.package.outputs.release_tag_name }}
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG_NAME,
              });
              core.setOutput("exists", "true");
              core.setOutput("id", String(release.data.id));
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                return;
              }
              throw error;
            }

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.package.outputs.release_tag_name }}
          RELEASE_TITLE: ${{ steps.pr.outputs.release_title }}
          RELEASE_BODY: ${{ steps.pr.outputs.release_body }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              target_commitish: process.env.MERGE_SHA,
              name: process.env.RELEASE_TITLE,
              body: process.env.RELEASE_BODY,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });
